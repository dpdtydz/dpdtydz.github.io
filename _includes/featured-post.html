{% assign featured = include.post %}
<article class="featured-story"><a class="featured-art" href="{{ featured.url | relative_url }}" aria-hidden="true" tabindex="-1">{% include post-art.html post=featured %}</a><div class="featured-copy"><p class="eyebrow">Latest writing</p><h2><a class="story-title" href="{{ featured.url | relative_url }}">{{ featured.title | escape }}</a></h2><p>{{ featured.excerpt | strip_html | normalize_whitespace | truncate: 180 | escape }}</p><div class="story-meta"><span>{{ featured.tags | first | escape }}</span><time datetime="{{ featured.date | date: '%Y-%m-%d' }}">{{ featured.date | date: '%Y.%m.%d' }}</time></div><a class="quiet-link" href="{{ featured.url | relative_url }}">이 글 읽기 <span aria-hidden="true">↗</span></a></div></article>
